{{- $network := list "NEXT_PUBLIC_VERANA_CHAIN_ID" "NEXT_PUBLIC_VERANA_CHAIN_NAME" "NEXT_PUBLIC_VERANA_RPC_ENDPOINT" "NEXT_PUBLIC_VERANA_INDEXER_BASE_URL" "NEXT_PUBLIC_VERANA_EXPLORER_URL" }}
{{- range $key := $network }}
{{- $_ := required (printf "env.%s is not set: pass values-devnet.yaml or values-testnet.yaml" $key) (index $.Values.env $key) }}
{{- end }}
{{- $_ := required "global.domain is not set: pass values-devnet.yaml or values-testnet.yaml" .Values.global.domain }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
{{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
{{- end }}
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image.repository | default "veranalabs/verana-front" }}:{{ .Values.image.tag | default .Chart.Version }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
{{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
{{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ tpl .value $ | quote }}
{{- end }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
{{- if .Values.resources }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
{{- if eq (.Values.ingress.type | default "ingress") "gateway" }}
{{- $gw := .Values.ingress.gateway | default dict }}
# Gateway API route, for a cluster served by a Gateway instead of ingress-nginx.
# The Gateway listener named here terminates TLS, so ingress.tlsSecret and the
# nginx annotations take no part in this mode.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-{{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ required "ingress.gateway.name is needed when ingress.type is gateway" $gw.name }}
      {{- with $gw.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $gw.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ tpl .Values.ingress.host . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.name }}
          port: {{ .Values.service.port }}
{{- else }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-{{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/enable-cors: "{{ .Values.ingress.public.enableCors | default "true" }}"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ tpl .Values.ingress.host . }}
      secretName: {{ tpl .Values.ingress.tlsSecret . }}
  rules:
    - host: {{ tpl .Values.ingress.host . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                 name: {{ .Values.name }}
                 port:
                   number: {{ .Values.service.port }}
{{- end }}
{{- end }}
