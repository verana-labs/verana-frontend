# Global configuration for the application
global:
  domain: ""

# General configuration
name: verana-frontend
host: app
replicas: 1

# Image configuration
image:
  pullPolicy: IfNotPresent
  repository: ""
  tag: ""

# Service configuration
service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

# Node scheduling preferences
nodeSelector:
  kubernetes.io/hostname: cluster-utc-node-07efe5

# Environment variables consumed by the application. Network values have no default:
# pass values-devnet.yaml or values-testnet.yaml (or your own) at deploy time.
env:
  NEXT_PUBLIC_PORT: "3000"
  NEXT_PUBLIC_BASE_URL: ""
  NEXT_PUBLIC_VERANA_CHAIN_ID: ""
  NEXT_PUBLIC_VERANA_CHAIN_NAME: ""
  NEXT_PUBLIC_VERANA_RPC_ENDPOINT: ""
  NEXT_PUBLIC_VERANA_REST_ENDPOINT: ""
  NEXT_PUBLIC_VERANA_INDEXER_BASE_URL: ""
  NEXT_PUBLIC_VERANA_EXPLORER_URL: ""
  NEXT_PUBLIC_VERANA_VISUALIZER_URL: ""
  NEXT_PUBLIC_VERANA_TOPUP_VS: ""
  NEXT_PUBLIC_VERANA_SIGN_DIRECT_MODE: "true"
  NEXT_PUBLIC_SESSION_LIFETIME_SECONDS: "86400"
  NEXT_PUBLIC_LOW_BALANCE_WARN_UVNA: "1000000"

# Additional env variables if needed (list of {name, value})
extraEnv: []

# Resource requests/limits for the frontend container
resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

# Optional ingress configuration
ingress:
  enabled: true
  host: "{{ .Values.host }}.{{ .Values.global.domain }}"
  tlsSecret: public.{{ .Values.host }}.{{ .Values.global.domain }}-cert
  public:
    enableCors: true
  private:
    enableCors: true
    whitelistSourceRange: "" # e.g. "xxx.xx.xxx.xxx/32"
    tlsSecret: "private.{{ .Values.host }}.{{ .Values.global.domain }}-cert"
    host: ""
