version: "3"

services:
  verana-front:
    image: veranalabs/verana-front:main
    ports:
      - 2904:3000
    build: 
      context: ../
      dockerfile: Dockerfile
    command: yarn start
    environment:
      - NEXT_PUBLIC_PORT=3000
    networks:
      - verana

networks:
  verana:
    driver: bridge