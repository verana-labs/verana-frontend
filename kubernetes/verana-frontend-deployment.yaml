apiVersion: apps/v1
kind: Deployment
metadata:
  name:  ${DEPLOYMENT_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app:  verana-frontend-app
  template:
    metadata:
      labels:
        app:  verana-frontend-app
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${CLUSTER_NODE}
      containers:
      - name:  verana-frontend-app
        image: veranalabs/${IMAGE_NAME}:${IMAGE_TAG}
        imagePullPolicy: IfNotPresent
        env:
        - name: NEXT_PUBLIC_PORT
          value: "${NEXT_PUBLIC_PORT}"
        - name: NEXT_PUBLIC_BASE_URL
          value: "${NEXT_PUBLIC_BASE_URL}"
        - name: NEXT_PUBLIC_VERANA_CHAIN_ID
          value: "${NEXT_PUBLIC_VERANA_CHAIN_ID}"
        - name: NEXT_PUBLIC_VERANA_CHAIN_NAME
          value: "${NEXT_PUBLIC_VERANA_CHAIN_NAME}"
        - name: NEXT_PUBLIC_VERANA_RPC_ENDPOINT
          value: "${NEXT_PUBLIC_VERANA_RPC_ENDPOINT}"
        - name: NEXT_PUBLIC_VERANA_REST_ENDPOINT
          value: "${NEXT_PUBLIC_VERANA_REST_ENDPOINT}"
        - name: NEXT_PUBLIC_VERANA_INDEXER_BASE_URL
          value: "${NEXT_PUBLIC_VERANA_INDEXER_BASE_URL}"
        - name: NEXT_PUBLIC_VERANA_EXPLORER_URL
          value: "${NEXT_PUBLIC_VERANA_EXPLORER_URL}"
        - name: NEXT_PUBLIC_VERANA_VISUALIZER_URL
          value: "${NEXT_PUBLIC_VERANA_VISUALIZER_URL}"
        - name: NEXT_PUBLIC_VERANA_TOPUP_VS
          value: "${NEXT_PUBLIC_VERANA_TOPUP_VS}"
        - name: NEXT_PUBLIC_VERANA_SIGN_DIRECT_MODE
          value: "${NEXT_PUBLIC_VERANA_SIGN_DIRECT_MODE}"
        - name: NEXT_PUBLIC_SESSION_LIFETIME_SECONDS
          value: "${NEXT_PUBLIC_SESSION_LIFETIME_SECONDS}"
        - name: NEXT_PUBLIC_LOW_BALANCE_WARN_UVNA
          value: "${NEXT_PUBLIC_LOW_BALANCE_WARN_UVNA}"
        - name: NEXT_PUBLIC_VERANA_WEBSOCKET
          value: "${NEXT_PUBLIC_VERANA_WEBSOCKET}"
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
